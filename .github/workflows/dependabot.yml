name: Review Dependabot PRs

on:
  pull_request:
    branches: [master]

jobs:
  build_base:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'hyper1FU'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-base
          path: dist/
          include-hidden-files: true

  build_pr:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'hyper1FU'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-pr
          path: dist/
          include-hidden-files: true

  compare:
    needs: [build_base, build_pr]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-base
          path: dist-base/
      - uses: actions/download-artifact@v8
        with:
          name: dist-pr
          path: dist-pr/
      - name: Compare
        run: |
          if diff -r dist-base/ dist-pr/ > diff.txt; then
            echo 'No differences found.' >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo 'Differences found.'
              echo '```diff'
              head -c 60000 diff.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diff
          path: diff.txt
